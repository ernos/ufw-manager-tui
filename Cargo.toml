[package]
name = "ufw-manager-tui"
repository = "https://github.com/ernos/ufw-manager-tui"
homepage = "https://www.yourdev.net/ufw-manager-tui"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
description = "A friendly terminal UI for managing ufw firewall rules without getting locked out"
license = "MIT"
readme = "README.md"
keywords = ["ufw", "firewall", "tui", "security", "networking"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "ufw_manager"
path = "src/lib.rs"

[[bin]]
name = "ufw-manager-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ipnet = "2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.5"
thiserror = "2"
toml = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
